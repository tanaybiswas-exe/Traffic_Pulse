<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ড্রাইভার রিয়েল নেভিগেটর - TrafficPulse BD</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Hind+Siliguri:wght@400;600;700&display=swap');
    body { font-family: 'Hind Siliguri', sans-serif; }
    .mono { font-family: 'Chakra Petch', monospace; }
    #driverMap { height: calc(100vh - 290px); width: 100%; border-radius: 12px; }
  </style>
</head>
<body class="bg-[#070A0F] text-slate-100 p-2.5 font-sans">
  <div class="max-w-md mx-auto space-y-2.5">
    
    <!-- হেডার ও অ্যাক্টিভেশন -->
    <div class="bg-[#0E131F] border border-slate-800 p-2.5 rounded-2xl flex justify-between items-center shadow-lg">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-red-500" id="gpsIndicator"></span>
        <span class="text-xs font-bold text-slate-300" id="gpsText">জিপিএস অফলাইন</span>
      </div>
      
      <div class="flex gap-1.5">
        <button onclick="startHardwareGPS()" id="startBtn" class="px-3 py-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs rounded-xl flex items-center gap-1 shadow">
          <i class="fa-solid fa-location-crosshairs"></i> রিয়েল GPS
        </button>
        <button onclick="startVirtualDrive()" id="simBtn" class="px-3 py-1 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold text-xs rounded-xl flex items-center gap-1 shadow">
          <i class="fa-solid fa-car-side"></i> ড্রাইভ মোড
        </button>
      </div>
    </div>

    <!-- নিকটস্থ হাসপাতাল ড্রপডাউন -->
    <div class="bg-[#0E131F] border border-slate-800 p-2.5 rounded-2xl space-y-1">
      <div class="flex justify-between items-center">
        <span class="text-[11px] text-slate-400 font-semibold"><i class="fa-solid fa-hospital text-emerald-400"></i> নিকটস্থ হাসপাতাল ও ক্লিনিক (OpenStreetMap):</span>
        <button onclick="requestNearby()" class="text-[10px] text-cyan-400 hover:underline"><i class="fa-solid fa-rotate"></i> রিফ্রেশ</button>
      </div>
      <select id="hospitalSelect" onchange="changeTarget()" class="w-full bg-slate-950 border border-slate-700 text-xs rounded-xl p-2 text-white focus:outline-none focus:border-emerald-500">
        <option value="23.7260,90.3976,ঢাকা মেডিকেল কলেজ হাসপাতাল (DMCH)">ঢাকা মেডিকেল কলেজ (DMCH)</option>
        <option value="23.7398,90.3958,বিএসএমএমইউ (পিজি হাসপাতাল)">বিএসএমএমইউ (পিজি হাসপাতাল)</option>
        <option value="23.7533,90.3816,স্কয়ার হাসপাতাল লিমিটেড">স্কয়ার হাসপাতাল লিমিটেড</option>
      </select>
    </div>

    <!-- স্পিডোমিটার ও দূরত্ব -->
    <div class="grid grid-cols-2 gap-2">
      <div class="bg-[#0E131F] border border-slate-800 p-2 rounded-2xl text-center">
        <div class="text-[10px] text-slate-400 font-semibold">লাইভ স্পিড</div>
        <div class="text-xl font-black text-cyan-400 mono" id="driverSpeed">০ <span class="text-xs font-normal">কিমি/ঘণ্টা</span></div>
      </div>
      <div class="bg-[#0E131F] border border-slate-800 p-2 rounded-2xl text-center">
        <div class="text-[10px] text-slate-400 font-semibold">বাকি দূরত্ব / সময়</div>
        <div class="text-base font-bold text-amber-400 mono mt-0.5" id="driverEta">-- কিমি</div>
      </div>
    </div>

    <!-- নেভিগেশন ম্যাপ -->
    <div class="bg-[#0E131F] border border-slate-800 p-2 rounded-2xl shadow-xl">
      <div id="driverMap"></div>
    </div>

  </div>

  <script>
    const map = L.map('driverMap', { zoomControl: false }).setView([23.7380, 90.3950], 14);
    
    // বেস ম্যাপ
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    // TomTom লাইভ ট্রাফিক ফ্লো লেয়ার (ড্রাইভার স্ক্রিনের জন্য)
    const tomtomApiKey = "7YuULGQHeO6wW1GkYYP6dqSu84Wn2TPb";
    L.tileLayer(`https://{s}.api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=${tomtomApiKey}`, {
      maxZoom: 19,
      opacity: 0.8,
      subdomains: ['a', 'b', 'c', 'd']
    }).addTo(map);

    let myMarker = null;
    let destMarker = null;
    let routeLine = null;
    let ws = null;
    const driverId = "AMB_" + Math.floor(100 + Math.random() * 900);

    let currentDest = { lat: 23.7260, lon: 90.3976, name: "ঢাকা মেডিকেল কলেজ হাসপাতাল (DMCH)" };

    const ambIcon = L.divIcon({
      html: `<div style="background-color: #ef4444; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px #ef4444; border: 2px solid white; font-size: 15px;">🚑</div>`,
      className: '',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    function connectWS() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      ws = new WebSocket(proto + window.location.host + '/ws/driver');

      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        document.getElementById('driverEta').textContent = `${d.distance_km} কিমি (~ ${d.eta_mins} মিনিট)`;
        document.getElementById('driverSpeed').innerHTML = `${d.speed} <span class="text-xs font-normal">কিমি/ঘণ্টা</span>`;

        if (d.nearby_hospitals && d.nearby_hospitals.length > 0) {
          const select = document.getElementById('hospitalSelect');
          select.innerHTML = '';
          d.nearby_hospitals.forEach(h => {
            select.innerHTML += `<option value="${h.lat},${h.lon},${h.name}">${h.name} (${h.dist_km} কিমি)</option>`;
          });
        }

        if (d.route_coords && d.route_coords.length > 0) {
          if (routeLine) map.removeLayer(routeLine);
          routeLine = L.polyline(d.route_coords, { color: '#10b981', weight: 6, opacity: 0.9 }).addTo(map);
        }
      };
    }

    function changeTarget() {
      const val = document.getElementById('hospitalSelect').value.split(',');
      currentDest = { lat: parseFloat(val[0]), lon: parseFloat(val[1]), name: val[2] };

      if (destMarker) map.removeLayer(destMarker);
      destMarker = L.marker([currentDest.lat, currentDest.lon]).addTo(map).bindPopup(currentDest.name).openPopup();

      if (myMarker) {
        sendUpdate(myMarker.getLatLng().lat, myMarker.getLatLng().lng, 15);
      }
    }

    function sendUpdate(lat, lon, spd, reqNearby = false) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          driver_id: driverId,
          lat: lat,
          lon: lon,
          speed: spd,
          req_nearby: reqNearby,
          destination: currentDest.name,
          dest_lat: currentDest.lat,
          dest_lon: currentDest.lon
        }));
      }
    }

    function requestNearby() {
      if (myMarker) {
        sendUpdate(myMarker.getLatLng().lat, myMarker.getLatLng().lng, 0, true);
      }
    }

    // ১. ডিভাইসের আসল হার্ডওয়্যার জিপিএস
    function startHardwareGPS() {
      connectWS();
      changeTarget();

      if (!navigator.geolocation) {
        alert("আপনার ব্রাউজারে লোকেশন সেন্সর সাপোর্ট করে না!");
        return;
      }

      document.getElementById('gpsIndicator').className = "w-3 h-3 rounded-full bg-emerald-400 animate-ping";
      document.getElementById('gpsText').textContent = "রিয়েল GPS সক্রিয়";

      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const spd = pos.coords.speed || 0;

          if (!myMarker) {
            myMarker = L.marker([lat, lon], { icon: ambIcon }).addTo(map);
            map.setView([lat, lon], 16);
            sendUpdate(lat, lon, spd, true);
          } else {
            myMarker.setLatLng([lat, lon]);
            sendUpdate(lat, lon, spd);
          }
        },
        (err) => {
          document.getElementById('gpsIndicator').className = "w-3 h-3 rounded-full bg-amber-400";
          alert("GPS অ্যাক্সেস পাওয়া যায়নি (" + err.message + ")। সহজে টেস্ট করার জন্য 'ড্রাইভ মোড' ব্যবহার করুন!");
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    // ২. ড্রাইভ মোড
    let driveInterval = null;
    function startVirtualDrive() {
      connectWS();
      changeTarget();

      document.getElementById('gpsIndicator').className = "w-3 h-3 rounded-full bg-cyan-400 animate-ping";
      document.getElementById('gpsText').textContent = "ড্রাইভ মোড সক্রিয়";

      if (driveInterval) clearInterval(driveInterval);

      const path = [
        [23.7310, 90.3985],
        [23.7383, 90.3956], // শাহবাগ
        [23.7450, 90.3945],
        [23.7508, 90.3935], // কারওয়ান বাজার
        [23.7545, 90.3910],
        [23.7570, 90.3888]  // ফার্মগেট
      ];

      let idx = 0;
      driveInterval = setInterval(() => {
        const pt = path[idx % path.length];
        idx++;

        if (!myMarker) {
          myMarker = L.marker(pt, { icon: ambIcon }).addTo(map);
          map.setView(pt, 15);
          sendUpdate(pt[0], pt[1], 13.5, true);
        } else {
          myMarker.setLatLng(pt);
          sendUpdate(pt[0], pt[1], 13.5);
        }
      }, 2500);
    }

    window.onload = () => {
      changeTarget();
    };
  </script>
</body>
</html>
