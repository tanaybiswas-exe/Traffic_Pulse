<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Driver AI Navigator - TrafficPulse BD</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'Chakra Petch', monospace; }
    #driverMap { height: calc(100vh - 310px); width: 100%; border-radius: 12px; }
  </style>
</head>
<body class="bg-[#070A0F] text-slate-100 p-2.5 font-sans">
  <div class="max-w-md mx-auto space-y-2.5">
    
    <!-- Status & Mode Selector -->
    <div class="bg-[#0E131F] border border-slate-800 p-2.5 rounded-2xl flex justify-between items-center shadow-lg">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-red-500" id="gpsIndicator"></span>
        <span class="text-xs font-bold text-slate-300" id="gpsText">GPS Ready</span>
      </div>
      
      <div class="flex gap-1.5">
        <button onclick="startLiveGPS()" id="startBtn" class="px-3 py-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs rounded-xl flex items-center gap-1 shadow">
          <i class="fa-solid fa-location-crosshairs"></i> Live GPS
        </button>
        <button onclick="startSimulation()" id="simBtn" class="px-3 py-1 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold text-xs rounded-xl flex items-center gap-1 shadow">
          <i class="fa-solid fa-play"></i> Drive Mode
        </button>
      </div>
    </div>

    <!-- Live Traffic & Routing Information Box -->
    <div class="bg-[#0E131F] border border-slate-800 p-2.5 rounded-2xl space-y-1.5">
      <div class="flex justify-between items-center">
        <span class="text-[11px] text-slate-400 font-semibold"><i class="fa-solid fa-road text-cyan-400"></i> Road & Traffic Condition:</span>
        <span id="trafficBadge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400">Checking...</span>
      </div>
      
      <!-- Nearby Recommended Hospitals Selector -->
      <div>
        <label class="text-[11px] text-slate-400 font-semibold flex justify-between">
          <span>Nearest Hospitals & Clinics:</span>
          <button onclick="fetchNearby()" class="text-[10px] text-emerald-400 hover:underline"><i class="fa-solid fa-rotate"></i> Auto-Detect</button>
        </label>
        <select id="hospitalSelect" onchange="changeDestination()" class="w-full bg-slate-950 border border-slate-700 text-xs rounded-xl p-2 text-white focus:outline-none focus:border-emerald-500 mt-1">
          <option value="23.7260,90.3976,Dhaka Medical College Hospital (DMCH)">Dhaka Medical College (DMCH) - 2.1 km</option>
          <option value="23.7398,90.3958,BSMMU (PG Hospital)">BSMMU (PG Hospital) - 1.4 km</option>
          <option value="23.7533,90.3816,Square Hospital Ltd.">Square Hospital Ltd. - 3.2 km</option>
        </select>
      </div>
    </div>

    <!-- Telemetry Cards -->
    <div class="grid grid-cols-2 gap-2">
      <div class="bg-[#0E131F] border border-slate-800 p-2 rounded-2xl text-center">
        <div class="text-[10px] text-slate-400 font-semibold">SPEED</div>
        <div class="text-xl font-black text-cyan-400 mono" id="driverSpeed">0 <span class="text-xs font-normal">km/h</span></div>
      </div>
      <div class="bg-[#0E131F] border border-slate-800 p-2 rounded-2xl text-center">
        <div class="text-[10px] text-slate-400 font-semibold">REMAINING / ETA</div>
        <div class="text-base font-bold text-amber-400 mono" id="driverEta">-- km</div>
      </div>
    </div>

    <!-- Live Map -->
    <div class="bg-[#0E131F] border border-slate-800 p-2 rounded-2xl shadow-xl">
      <div id="driverMap"></div>
    </div>

  </div>

  <script>
    const map = L.map('driverMap', { zoomControl: false }).setView([23.7380, 90.3950], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let myMarker = null;
    let destMarker = null;
    let routeLine = null;
    let ws = null;
    let currentDest = { lat: 23.7260, lon: 90.3976, name: "Dhaka Medical College Hospital (DMCH)" };

    const ambIcon = L.divIcon({
      html: `<div style="background-color: #ef4444; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px #ef4444; border: 2px solid white; font-size: 15px;">🚑</div>`,
      className: '',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    function connectWS() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      ws = new WebSocket(proto + window.location.host + '/ws/driver');

      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        document.getElementById('driverEta').textContent = `${d.distance_km} km (~ ${d.eta_mins} min)`;
        document.getElementById('driverSpeed').innerHTML = `${d.speed} <span class="text-xs font-normal">km/h</span>`;

        // Update Traffic Condition Badge
        const tBadge = document.getElementById('trafficBadge');
        tBadge.textContent = d.traffic_status;
        if (d.traffic_status.includes("Heavy")) {
          tBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-red-500/20 text-red-400";
        } else if (d.traffic_status.includes("Moderate")) {
          tBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-400";
        } else {
          tBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400";
        }

        // Populate dynamic nearby hospitals
        if (d.nearby_hospitals && d.nearby_hospitals.length > 0) {
          const select = document.getElementById('hospitalSelect');
          select.innerHTML = '';
          d.nearby_hospitals.forEach(h => {
            select.innerHTML += `<option value="${h.lat},${h.lon},${h.name}">${h.name} (${h.dist_km} km)</option>`;
          });
        }

        if (d.route_coords && d.route_coords.length > 0) {
          if (routeLine) map.removeLayer(routeLine);
          routeLine = L.polyline(d.route_coords, { color: '#10b981', weight: 6, opacity: 0.9 }).addTo(map);
        }
      };
    }

    function fetchNearby() {
      if (myMarker && ws && ws.readyState === WebSocket.OPEN) {
        const lat = myMarker.getLatLng().lat;
        const lon = myMarker.getLatLng().lng;
        ws.send(JSON.stringify({
          lat: lat,
          lon: lon,
          req_nearby: true,
          destination: currentDest.name,
          dest_lat: currentDest.lat,
          dest_lon: currentDest.lon
        }));
      }
    }

    function changeDestination() {
      const val = document.getElementById('hospitalSelect').value.split(',');
      currentDest = { lat: parseFloat(val[0]), lon: parseFloat(val[1]), name: val[2] };

      if (destMarker) map.removeLayer(destMarker);
      destMarker = L.marker([currentDest.lat, currentDest.lon]).addTo(map).bindPopup(currentDest.name).openPopup();

      if (myMarker) {
        sendLocation(myMarker.getLatLng().lat, myMarker.getLatLng().lng, 15);
      }
    }

    function sendLocation(lat, lon, speed, reqNearby = false) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          lat: lat,
          lon: lon,
          speed: speed,
          req_nearby: reqNearby,
          destination: currentDest.name,
          dest_lat: currentDest.lat,
          dest_lon: currentDest.lon
        }));
      }
    }

    // 1. Real Hardware GPS
    function startLiveGPS() {
      connectWS();
      changeDestination();

      if (!navigator.geolocation) {
        alert("Geolocation not supported by browser!");
        return;
      }

      document.getElementById('gpsIndicator').className = "w-3 h-3 rounded-full bg-emerald-400 animate-ping";
      document.getElementById('gpsText').textContent = "Real GPS Active";

      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const spd = pos.coords.speed || 0;

          if (!myMarker) {
            myMarker = L.marker([lat, lon], { icon: ambIcon }).addTo(map);
            map.setView([lat, lon], 16);
            sendLocation(lat, lon, spd, true); // fetch nearby hospitals first time
          } else {
            myMarker.setLatLng([lat, lon]);
            sendLocation(lat, lon, spd);
          }
        },
        (err) => {
          document.getElementById('gpsIndicator').className = "w-3 h-3 rounded-full bg-amber-400";
          alert("GPS Permission issue. You can use 'Drive Mode' to test instantly!");
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    // 2. Instant Simulation Mode
    let simInterval = null;
    function startSimulation() {
      connectWS();
      changeDestination();

      document.getElementById('gpsIndicator').className = "w-3 h-3 rounded-full bg-cyan-400 animate-ping";
      document.getElementById('gpsText').textContent = "Drive Mode Active";

      if (simInterval) clearInterval(simInterval);

      const points = [
        [23.7310, 90.3985],
        [23.7383, 90.3956],
        [23.7450, 90.3945],
        [23.7508, 90.3935],
        [23.7545, 90.3910],
        [23.7570, 90.3888]
      ];

      let idx = 0;
      simInterval = setInterval(() => {
        const pt = points[idx % points.length];
        idx++;

        if (!myMarker) {
          myMarker = L.marker(pt, { icon: ambIcon }).addTo(map);
          map.setView(pt, 15);
          sendLocation(pt[0], pt[1], 14, true); // Fetch nearby on start
        } else {
          myMarker.setLatLng(pt);
          sendLocation(pt[0], pt[1], 14);
        }
      }, 2500);
    }

    window.onload = () => {
      changeDestination();
    };
  </script>
</body>
</html>
