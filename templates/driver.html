<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Driver Telemetry & Navigation - TrafficPulse</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    #driverMap { height: calc(100vh - 380px); width: 100%; border-radius: 0.75rem; z-index: 1; cursor: crosshair; }
    
    .hud-inverted {
      transform: scaleY(-1);
      background-color: #000000 !important;
    }
  </style>
</head>
<body id="driverBody" class="p-2.5 md:p-3 font-sans transition-all">
  <div class="max-w-md mx-auto space-y-2">
    
    <div class="bg-[#131b2e] border border-slate-800 p-2.5 rounded-xl flex justify-between items-center shadow-lg">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-amber-500 animate-pulse" id="gpsLed"></span>
        <div>
          <div class="text-xs font-semibold text-slate-200" id="gpsStatus">Acquiring live location...</div>
          <div class="text-[10px] text-slate-500" id="coordsText">Connecting positioning engine</div>
        </div>
      </div>
      
      <div class="flex gap-1.5">
        <button onclick="toggleHud()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-blue-400 font-semibold text-xs rounded-lg border border-slate-700">
          HUD
        </button>
        <button onclick="sendSosSignal()" id="sosButton" class="px-2 py-1 bg-rose-700 hover:bg-rose-600 text-white font-bold text-xs rounded-lg shadow">
          SOS
        </button>
        <button onclick="reCenterUserLocation()" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs rounded-lg shadow">
          <i class="fa-solid fa-crosshairs"></i> My Location
        </button>
      </div>
    </div>

    <div class="bg-[#131b2e] border border-slate-800 p-2.5 rounded-xl space-y-2">
      <div class="flex gap-1.5">
        <input type="text" id="searchInput" placeholder="Search destination (or tap anywhere on map)..." 
               class="w-full bg-slate-900 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-white focus:outline-none focus:border-blue-500">
        <button onclick="searchCustomLocation()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg">
          Search
        </button>
      </div>

      <div>
        <label class="text-[10px] text-slate-400 font-medium flex justify-between">
          <span>Auto-Suggested Hospitals in Sector:</span>
          <span class="text-blue-400 text-[10px]">Real-time Proximity</span>
        </label>
        <select id="hospitalSelect" onchange="updateTargetLocation()" class="w-full bg-slate-900 border border-slate-700 text-xs rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500 mt-1">
          <option value="">Querying nearby facilities...</option>
        </select>
      </div>
    </div>

    <div class="grid grid-cols-4 gap-1 text-center text-xs font-medium">
      <button onclick="selectCondition('Cardiac')" id="triageCardiac" class="p-1 rounded-lg border border-slate-700 text-slate-300">
        Cardiac
      </button>
      <button onclick="selectCondition('Neuro')" id="triageNeuro" class="p-1 rounded-lg border border-slate-700 text-slate-300">
        Stroke
      </button>
      <button onclick="selectCondition('Trauma')" id="triageTrauma" class="p-1 rounded-lg border border-slate-700 text-slate-300">
        Trauma
      </button>
      <button onclick="selectCondition('General')" id="triageGeneral" class="p-1 rounded-lg border border-blue-500 bg-blue-500/20 text-blue-400">
        Standard
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div class="bg-[#131b2e] border border-slate-800 p-1.5 rounded-xl text-center">
        <div class="text-[10px] text-slate-400 font-medium">Telemetry Speed</div>
        <div class="text-lg font-bold text-blue-400 mono" id="spdMetric">0 <span class="text-xs font-normal">km/h</span></div>
      </div>
      <div class="bg-[#131b2e] border border-slate-800 p-1.5 rounded-xl text-center">
        <div class="text-[10px] text-slate-400 font-medium">Distance & ETA</div>
        <div class="text-sm font-semibold text-emerald-400 mono mt-0.5" id="etaMetric">-- km</div>
      </div>
    </div>

    <div id="guidanceBox" class="bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs text-slate-300 flex items-center gap-2">
      <i class="fa-solid fa-diamond-turn-right text-blue-400"></i>
      <span id="guidanceText">Tap map or search to assign destination...</span>
    </div>

    <div class="bg-[#131b2e] border border-slate-800 p-1.5 rounded-xl shadow-lg">
      <div id="driverMap"></div>
    </div>

  </div>

  <script>
    const map = L.map('driverMap', { zoomControl: false }).setView([23.8500, 90.2600], 13);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const tomtomApiKey = "7YuULGQHeO6wW1GkYYP6dqSu84Wn2TPb";
    L.tileLayer(`https://{s}.api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=${tomtomApiKey}`, {
      maxZoom: 19,
      opacity: 0.75,
      subdomains: ['api']
    }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 300);

    let vehicleMarker = null;
    let targetMarker = null;
    let routePolyline = null;
    let ws = null;
    let selectedTriage = "General";
    let isSosEngaged = false;
    let selectedDestination = null;
    let currentUserLat = null;
    let currentUserLon = null;
    const unitId = "UNIT_" + Math.floor(100 + Math.random() * 900);

    const unitIcon = L.divIcon({
      html: `<div style="background-color: #ef4444; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); font-size: 14px;">🚑</div>`,
      className: '',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    const targetIcon = L.divIcon({
      html: `<div style="background-color: #10b981; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); font-size: 13px;">🎯</div>`,
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    function toggleHud() {
      document.getElementById('driverBody').classList.toggle('hud-inverted');
    }

    function sendSosSignal() {
      isSosEngaged = !isSosEngaged;
      const btn = document.getElementById('sosButton');
      if (isSosEngaged) {
        btn.className = "px-2 py-1 bg-red-600 text-white font-bold text-xs rounded-lg shadow ring-2 ring-red-400";
        btn.textContent = "SOS ACTIVE";
      } else {
        btn.className = "px-2 py-1 bg-rose-700 hover:bg-rose-600 text-white font-bold text-xs rounded-lg shadow";
        btn.textContent = "SOS";
      }
      if (vehicleMarker) transmitPosition(vehicleMarker.getLatLng().lat, vehicleMarker.getLatLng().lng, 15);
    }

    function selectCondition(cond) {
      selectedTriage = cond;
      ['triageCardiac', 'triageNeuro', 'triageTrauma', 'triageGeneral'].forEach(id => {
        document.getElementById(id).className = "p-1 rounded-lg border border-slate-700 text-slate-300";
      });
      document.getElementById('triage' + cond).className = "p-1 rounded-lg border border-blue-500 bg-blue-500/20 text-blue-400 font-semibold";
      if (vehicleMarker) transmitPosition(vehicleMarker.getLatLng().lat, vehicleMarker.getLatLng().lng, 15);
    }

    function establishWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      ws = new WebSocket(proto + window.location.host + '/ws/driver');

      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        document.getElementById('etaMetric').textContent = `${d.dist_km} km (~${d.eta_mins} mins)`;
        document.getElementById('spdMetric').innerHTML = `${d.speed} <span class="text-xs font-normal">km/h</span>`;

        if (d.nav_steps && d.nav_steps.length > 0) {
          document.getElementById('guidanceText').textContent = d.nav_steps[0];
        }

        if (d.hospitals && d.hospitals.length > 0 && !selectedDestination) {
          const select = document.getElementById('hospitalSelect');
          select.innerHTML = '';
          d.hospitals.forEach(h => {
            select.innerHTML += `<option value="${h.lat},${h.lon},${h.name}">${h.name} (${h.dist_km} km) [ICU: ${h.icu}]</option>`;
          });
          updateTargetLocation();
        }

        if (d.route_coords && d.route_coords.length > 0) {
          if (routePolyline) map.removeLayer(routePolyline);
          routePolyline = L.polyline(d.route_coords, {
            color: '#10b981',
            weight: 5,
            opacity: 0.9
          }).addTo(map);
        }
      };
    }

    function updateTargetLocation() {
      const select = document.getElementById('hospitalSelect');
      if (!select.value) return;
      const parts = select.value.split(',');
      setDestinationPoint(parseFloat(parts[0]), parseFloat(parts[1]), parts[2]);
    }

    function setDestinationPoint(lat, lon, label) {
      selectedDestination = { lat: lat, lon: lon, name: label };

      if (targetMarker) map.removeLayer(targetMarker);
      targetMarker = L.marker([lat, lon], { icon: targetIcon }).addTo(map).bindPopup(`<b>Destination: ${label}</b>`).openPopup();

      if (vehicleMarker) {
        transmitPosition(vehicleMarker.getLatLng().lat, vehicleMarker.getLatLng().lng, 15);
      }
    }

    map.on('click', function(e) {
      setDestinationPoint(e.latlng.lat, e.latlng.lng, "Map Designated Waypoint");
    });

    function searchCustomLocation() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            const loc = data[0];
            const lat = parseFloat(loc.lat);
            const lon = parseFloat(loc.lon);
            map.setView([lat, lon], 14);
            setDestinationPoint(lat, lon, loc.display_name.split(',')[0]);
          } else {
            alert("Location not found. Please tap directly on map.");
          }
        })
        .catch(() => alert("Query error. Please click directly on the map."));
    }

    function transmitPosition(lat, lon, spd, refresh = false) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          driver_id: unitId,
          lat: lat,
          lon: lon,
          speed: spd,
          patient_condition: selectedTriage,
          sos_active: isSosEngaged,
          refresh_nodes: refresh,
          destination: selectedDestination ? selectedDestination.name : "Assigned Medical Facility",
          dest_lat: selectedDestination ? selectedDestination.lat : lat + 0.01,
          dest_lon: selectedDestination ? selectedDestination.lon : lon + 0.01
        }));
      }
    }

    function reCenterUserLocation() {
      if (currentUserLat && currentUserLon) {
        map.setView([currentUserLat, currentUserLon], 15);
      }
    }

    function handleResolvedPosition(lat, lon, spd, mode) {
      currentUserLat = lat;
      currentUserLon = lon;

      document.getElementById('gpsLed').className = "w-3 h-3 rounded-full bg-emerald-400";
      document.getElementById('gpsStatus').textContent = `Position Active (${mode})`;
      document.getElementById('coordsText').textContent = `${currentUserLat.toFixed(4)}, ${currentUserLon.toFixed(4)}`;

      if (!vehicleMarker) {
        vehicleMarker = L.marker([currentUserLat, currentUserLon], { icon: unitIcon }).addTo(map);
        map.setView([currentUserLat, currentUserLon], 15);
        transmitPosition(currentUserLat, currentUserLon, spd, true);
      } else {
        vehicleMarker.setLatLng([currentUserLat, currentUserLon]);
        transmitPosition(currentUserLat, currentUserLon, spd);
      }
    }

    function fallbackNetworkLocation() {
      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          if (data.latitude && data.longitude) {
            handleResolvedPosition(data.latitude, data.longitude, 0, "Network/IP");
          } else {
            handleResolvedPosition(23.8500, 90.2600, 0, "Default Anchor");
          }
        })
        .catch(() => {
          handleResolvedPosition(23.8500, 90.2600, 0, "Default Anchor");
        });
    }

    window.onload = () => {
      establishWebSocket();

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            handleResolvedPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.speed || 0, "GPS Satellite");
          },
          (err) => {
            console.warn("Satellite GPS delayed or blocked, engaging network location fallback.");
            fallbackNetworkLocation();
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
        );
      } else {
        fallbackNetworkLocation();
      }
    };
  </script>
</body>
</html>
