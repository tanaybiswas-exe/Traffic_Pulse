<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Driver Telemetry & Navigation - TrafficPulse</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap');
    body { font-family: 'Hind Siliguri', 'Inter', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    #driverMap { height: calc(100vh - 410px); width: 100%; border-radius: 0.75rem; z-index: 1; cursor: crosshair; }
    
    .hud-inverted {
      transform: scaleY(-1);
      background-color: #000000 !important;
    }

    .vehicle-marker-icon {
      transition: transform 0.2s linear;
      transform-origin: center center;
    }
  </style>
</head>
<body id="driverBody" class="p-2.5 md:p-3 font-sans transition-all">
  <div class="max-w-md mx-auto space-y-2">
    
    <!-- হেডার বার ও ভাষা পরিবর্তন -->
    <div class="bg-[#131b2e] border border-slate-800 p-2.5 rounded-xl flex justify-between items-center shadow-lg">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-400 animate-ping" id="gpsLed"></span>
        <div>
          <div class="text-xs font-bold text-slate-200" id="gpsStatus" data-i18n="gps_searching">GPS সংযোগ সক্রিয়</div>
          <div class="text-[10px] text-slate-400 mono" id="coordsText">--.----, --.----</div>
        </div>
      </div>
      
      <div class="flex gap-1.5 items-center">
        <!-- Language Switcher -->
        <button onclick="toggleLanguage()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs rounded-lg border border-cyan-500/40">
          <span id="langLabel">ENG</span>
        </button>
        <button onclick="toggleHud()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-blue-400 font-bold text-xs rounded-lg border border-slate-700">
          HUD
        </button>
        <button onclick="sendSosSignal()" id="sosButton" class="px-2.5 py-1 bg-rose-700 hover:bg-rose-600 text-white font-bold text-xs rounded-lg shadow">
          SOS
        </button>
        <button onclick="reCenterUserLocation()" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-lg shadow">
          <i class="fa-solid fa-crosshairs"></i> <span data-i18n="btn_my_loc">আমার লোকেশন</span>
        </button>
      </div>
    </div>

    <!-- গন্তব্য নির্বাচন ও ড্রাইভ কন্ট্রোল -->
    <div class="bg-[#131b2e] border border-slate-800 p-2.5 rounded-xl space-y-2">
      <div class="flex gap-1.5">
        <input type="text" id="searchInput" placeholder="যেকোনো গন্তব্য লিখে সার্চ করুন (বা ম্যাপে ট্যাপ করুন)..." 
               class="w-full bg-slate-900 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-white focus:outline-none focus:border-blue-500">
        <button onclick="searchCustomLocation()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg shadow shrink-0" data-i18n="btn_search">
          সার্চ
        </button>
      </div>

      <div class="flex gap-2 items-center">
        <select id="hospitalSelect" onchange="handleSelectChange()" class="w-full bg-slate-900 border border-slate-700 text-xs rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
          <option value="" data-i18n="opt_searching">নিকটস্থ হাসপাতাল খোঁজা হচ্ছে...</option>
        </select>
        <button id="simDriveBtn" onclick="toggleRoadDrivingSimulation()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg shadow shrink-0 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-play"></i> <span id="driveBtnLabel" data-i18n="btn_run_trip">রান ট্রিপ</span>
        </button>
      </div>
    </div>

    <!-- ট্রায়াজ কন্ডিশন সিলেক্টর -->
    <div class="grid grid-cols-4 gap-1 text-center text-xs font-semibold">
      <button onclick="selectCondition('Cardiac')" id="triageCardiac" class="p-1 rounded-lg border border-slate-700 text-slate-300" data-i18n="tri_cardiac">
        হার্ট
      </button>
      <button onclick="selectCondition('Neuro')" id="triageNeuro" class="p-1 rounded-lg border border-slate-700 text-slate-300" data-i18n="tri_neuro">
        স্ট্রোক
      </button>
      <button onclick="selectCondition('Trauma')" id="triageTrauma" class="p-1 rounded-lg border border-slate-700 text-slate-300" data-i18n="tri_trauma">
        ট্রমা
      </button>
      <button onclick="selectCondition('General')" id="triageGeneral" class="p-1 rounded-lg border border-blue-500 bg-blue-500/20 text-blue-400 font-bold" data-i18n="tri_general">
        সাধারণ
      </button>
    </div>

    <!-- লাইভ স্পিডোমিটার ও ওডোমিটার -->
    <div class="grid grid-cols-2 gap-2">
      <div class="bg-[#131b2e] border border-slate-800 p-1.5 rounded-xl text-center">
        <div class="text-[10px] text-slate-400 font-medium" data-i18n="lbl_speed">লাইভ গতি</div>
        <div class="text-xl font-black text-cyan-400 mono" id="spdMetric">0.0 <span class="text-xs font-normal" data-i18n="unit_kmh">কিমি/ঘণ্টা</span></div>
      </div>
      <div class="bg-[#131b2e] border border-slate-800 p-1.5 rounded-xl text-center">
        <div class="text-[10px] text-slate-400 font-medium" data-i18n="lbl_eta">বাকি দূরত্ব ও সময়</div>
        <div class="text-sm font-extrabold text-emerald-400 mono mt-0.5" id="etaMetric">-- কিমি</div>
      </div>
    </div>

    <!-- লাইভ টার্ন-বাই-টার্ন নির্দেশিকা -->
    <div id="guidanceBox" class="bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs text-slate-300 flex items-center gap-2 shadow-inner">
      <i class="fa-solid fa-diamond-turn-right text-base text-cyan-400" id="navIcon"></i>
      <span id="guidanceText" class="font-medium" data-i18n="msg_guide_default">ম্যাপে ট্যাপ করুন বা গন্তব্য সার্চ করুন...</span>
    </div>

    <!-- নেভিগেশন ম্যাপ -->
    <div class="bg-[#131b2e] border border-slate-800 p-1.5 rounded-xl shadow-lg">
      <div id="driverMap"></div>
    </div>

  </div>

  <script>
    // দ্বিভাষিক ডিকশনারি
    const driverTranslations = {
      bn: {
        gps_searching: "লাইভ GPS সক্রিয়",
        btn_my_loc: "আমার লোকেশন",
        btn_search: "সার্চ",
        opt_searching: "নিকটস্থ হাসপাতাল খোঁজা হচ্ছে...",
        btn_run_trip: "রান ট্রিপ",
        btn_stop_trip: "ট্রিপ থামান",
        btn_arrived: "পৌঁছানো হয়েছে",
        tri_cardiac: "হার্ট",
        tri_neuro: "স্ট্রোক",
        tri_trauma: "ট্রমা",
        tri_general: "সাধারণ",
        lbl_speed: "লাইভ গতি",
        unit_kmh: "কিমি/ঘণ্টা",
        lbl_eta: "বাকি দূরত্ব ও সময়",
        msg_guide_default: "ম্যাপে ট্যাপ করুন বা গন্তব্য সার্চ করুন...",
        search_placeholder: "যেকোনো গন্তব্য লিখে সার্চ করুন (বা ম্যাপে ট্যাপ করুন)..."
      },
      en: {
        gps_searching: "Live GPS Active",
        btn_my_loc: "My Location",
        btn_search: "Search",
        opt_searching: "Querying nearby facilities...",
        btn_run_trip: "Run Trip",
        btn_stop_trip: "Stop Trip",
        btn_arrived: "Arrived!",
        tri_cardiac: "Cardiac",
        tri_neuro: "Stroke",
        tri_trauma: "Trauma",
        tri_general: "Standard",
        lbl_speed: "Road Velocity",
        unit_kmh: "km/h",
        lbl_eta: "Distance & ETA",
        msg_guide_default: "Tap on map or search to assign destination...",
        search_placeholder: "Search destination (or tap anywhere on map)..."
      }
    };

    let currentLang = localStorage.getItem('tp_lang') || 'bn';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('tp_lang', lang);
      document.getElementById('langLabel').textContent = lang === 'bn' ? 'ENG' : 'বাং';
      document.getElementById('searchInput').placeholder = driverTranslations[lang].search_placeholder;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (driverTranslations[lang][key]) {
          el.textContent = driverTranslations[lang][key];
        }
      });
    }

    function toggleLanguage() {
      setLanguage(currentLang === 'bn' ? 'en' : 'bn');
    }

    const map = L.map('driverMap', { zoomControl: false }).setView([23.8500, 90.2600], 14);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const tomtomApiKey = "7YuULGQHeO6wW1GkYYP6dqSu84Wn2TPb";
    L.tileLayer(`https://{s}.api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=${tomtomApiKey}`, {
      maxZoom: 19,
      opacity: 0.75,
      subdomains: ['api']
    }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 300);

    let vehicleMarker = null;
    let targetMarker = null;
    let routePolyline = null;
    let ws = null;
    let selectedTriage = "General";
    let isSosEngaged = false;
    let selectedDestination = null;
    let isCustomDestinationSet = false;
    let currentUserLat = null;
    let currentUserLon = null;
    let currentRoadPath = [];
    let driveSimulationTimer = null;
    let isSimulating = false;
    let currentBearing = 0;
    const unitId = "UNIT_" + Math.floor(100 + Math.random() * 900);

    function createAmbulanceIcon(angle = 0) {
      return L.divIcon({
        html: `<div class="vehicle-marker-icon" style="transform: rotate(${angle}deg); background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2.5px solid white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.9); font-size: 16px;">🚑</div>`,
        className: '',
        iconSize: [34, 34],
        iconAnchor: [17, 17]
      });
    }

    const targetIcon = L.divIcon({
      html: `<div style="background-color: #10b981; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2.5px solid white; box-shadow: 0 0 12px rgba(16, 185, 129, 0.8); font-size: 15px;">🎯</div>`,
      className: '',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const toRad = (d) => (d * Math.PI) / 180;
      const toDeg = (r) => (r * 180) / Math.PI;
      const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function toggleHud() {
      document.getElementById('driverBody').classList.toggle('hud-inverted');
    }

    function sendSosSignal() {
      isSosEngaged = !isSosEngaged;
      const btn = document.getElementById('sosButton');
      if (isSosEngaged) {
        btn.className = "px-2.5 py-1 bg-red-600 text-white font-bold text-xs rounded-lg shadow ring-4 ring-red-400";
        btn.textContent = currentLang === 'bn' ? "SOS সক্রিয়" : "SOS ACTIVE";
      } else {
        btn.className = "px-2.5 py-1 bg-rose-700 hover:bg-rose-600 text-white font-bold text-xs rounded-lg shadow";
        btn.textContent = "SOS";
      }
      if (vehicleMarker) transmitPosition(vehicleMarker.getLatLng().lat, vehicleMarker.getLatLng().lng, 15);
    }

    function selectCondition(cond) {
      selectedTriage = cond;
      ['triageCardiac', 'triageNeuro', 'triageTrauma', 'triageGeneral'].forEach(id => {
        document.getElementById(id).className = "p-1 rounded-lg border border-slate-700 text-slate-300";
      });
      document.getElementById('triage' + cond).className = "p-1 rounded-lg border border-blue-500 bg-blue-500/20 text-blue-400 font-bold";
      if (vehicleMarker) transmitPosition(vehicleMarker.getLatLng().lat, vehicleMarker.getLatLng().lng, 15);
    }

    function establishWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      ws = new WebSocket(proto + window.location.host + '/ws/driver');

      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        const distUnit = currentLang === 'bn' ? 'কিমি' : 'km';
        const minUnit = currentLang === 'bn' ? 'মিনিট' : 'mins';
        document.getElementById('etaMetric').textContent = `${d.dist_km} ${distUnit} (~${d.eta_mins} ${minUnit})`;
        
        if (!isSimulating) {
          document.getElementById('spdMetric').innerHTML = `${d.speed} <span class="text-xs font-normal">${currentLang === 'bn' ? 'কিমি/ঘণ্টা' : 'km/h'}</span>`;
        }

        if (d.nav_steps && d.nav_steps.length > 0) {
          document.getElementById('guidanceText').textContent = d.nav_steps[0];
        }

        if (d.hospitals && d.hospitals.length > 0) {
          const select = document.getElementById('hospitalSelect');
          let optionsHtml = '';
          if (isCustomDestinationSet && selectedDestination) {
            optionsHtml += `<option value="custom" selected>📍 ${currentLang === 'bn' ? 'চিহ্নিত' : 'Target'}: ${selectedDestination.name}</option>`;
          }
          d.hospitals.forEach(h => {
            optionsHtml += `<option value="${h.lat},${h.lon},${h.name}">${h.name} (${h.dist_km} ${distUnit}) [ICU: ${h.icu}]</option>`;
          });
          select.innerHTML = optionsHtml;

          if (!isCustomDestinationSet && !selectedDestination) {
            handleSelectChange();
          }
        }

        if (!isSimulating && d.route_coords && d.route_coords.length > 0) {
          currentRoadPath = d.route_coords;
          if (routePolyline) map.removeLayer(routePolyline);
          routePolyline = L.polyline(d.route_coords, {
            color: '#10b981',
            weight: 5,
            opacity: 0.9
          }).addTo(map);
        }
      };
    }

    function handleSelectChange() {
      const select = document.getElementById('hospitalSelect');
      if (!select.value || select.value === "custom") return;
      
      const parts = select.value.split(',');
      isCustomDestinationSet = false;
      setDestinationPoint(parseFloat(parts[0]), parseFloat(parts[1]), parts[2]);
    }

    function setDestinationPoint(lat, lon, label) {
      selectedDestination = { lat: lat, lon: lon, name: label };

      if (targetMarker) map.removeLayer(targetMarker);
      targetMarker = L.marker([lat, lon], { icon: targetIcon }).addTo(map).bindPopup(`<b>${label}</b>`).openPopup();

      document.getElementById('guidanceText').textContent = `${currentLang === 'bn' ? 'গন্তব্য লক করা হয়েছে' : 'Target Locked'}: ${label}`;

      if (vehicleMarker) {
        transmitPosition(vehicleMarker.getLatLng().lat, vehicleMarker.getLatLng().lng, 0);
      }
    }

    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lon = e.latlng.lng;
      isCustomDestinationSet = true;
      
      const select = document.getElementById('hospitalSelect');
      const customLabel = currentLang === 'bn' 
        ? `ম্যাপে চিহ্নিত স্থান (${lat.toFixed(3)}, ${lon.toFixed(3)})` 
        : `Map Waypoint (${lat.toFixed(3)}, ${lon.toFixed(3)})`;
      
      select.innerHTML = `<option value="custom" selected>📍 ${customLabel}</option>` + select.innerHTML;
      setDestinationPoint(lat, lon, customLabel);
    });

    function searchCustomLocation() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            const loc = data[0];
            const lat = parseFloat(loc.lat);
            const lon = parseFloat(loc.lon);
            const cleanName = loc.display_name.split(',')[0];
            
            isCustomDestinationSet = true;
            const select = document.getElementById('hospitalSelect');
            select.innerHTML = `<option value="custom" selected>📍 ${cleanName}</option>` + select.innerHTML;

            map.setView([lat, lon], 15);
            setDestinationPoint(lat, lon, cleanName);
          } else {
            alert(currentLang === 'bn' ? "স্থানটি পাওয়া যায়নি! ম্যাপে সরাসরি ট্যাপ করুন।" : "Location not found! Tap directly on map.");
          }
        })
        .catch(() => alert("Search error. Tap directly on map."));
    }

    function transmitPosition(lat, lon, spd, refresh = false) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          driver_id: unitId,
          lat: lat,
          lon: lon,
          speed: spd,
          patient_condition: selectedTriage,
          sos_active: isSosEngaged,
          refresh_nodes: refresh,
          destination: selectedDestination ? selectedDestination.name : null,
          dest_lat: selectedDestination ? selectedDestination.lat : null,
          dest_lon: selectedDestination ? selectedDestination.lon : null
        }));
      }
    }

    function reCenterUserLocation() {
      if (currentUserLat && currentUserLon) {
        map.setView([currentUserLat, currentUserLon], 16);
      }
    }

    function handleResolvedPosition(lat, lon, spd, mode) {
      if (currentUserLat && currentUserLon) {
        currentBearing = calculateBearing(currentUserLat, currentUserLon, lat, lon);
      }
      currentUserLat = lat;
      currentUserLon = lon;

      document.getElementById('gpsLed').className = "w-3 h-3 rounded-full bg-emerald-400";
      document.getElementById('gpsStatus').textContent = currentLang === 'bn' ? `লাইভ GPS সক্রিয় (${mode})` : `Live GPS Active (${mode})`;
      document.getElementById('coordsText').textContent = `${currentUserLat.toFixed(5)}, ${currentUserLon.toFixed(5)}`;

      if (!vehicleMarker) {
        vehicleMarker = L.marker([currentUserLat, currentUserLon], { icon: createAmbulanceIcon(currentBearing) }).addTo(map);
        map.setView([currentUserLat, currentUserLon], 16);
        transmitPosition(currentUserLat, currentUserLon, spd, true);
      } else if (!isSimulating) {
        vehicleMarker.setLatLng([currentUserLat, currentUserLon]);
        vehicleMarker.setIcon(createAmbulanceIcon(currentBearing));
        map.panTo([currentUserLat, currentUserLon]);
        transmitPosition(currentUserLat, currentUserLon, spd);
      }
    }

    function toggleRoadDrivingSimulation() {
      const btn = document.getElementById('simDriveBtn');
      const label = document.getElementById('driveBtnLabel');
      
      if (isSimulating) {
        clearInterval(driveSimulationTimer);
        isSimulating = false;
        label.textContent = currentLang === 'bn' ? "রান ট্রিপ" : "Run Trip";
        btn.className = "px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg shadow shrink-0 flex items-center gap-1.5";
        return;
      }

      if (!currentRoadPath || currentRoadPath.length < 2) {
        alert(currentLang === 'bn' ? "প্রথমে একটি গন্তব্য নির্ধারণ করুন অথবা ম্যাপে ট্যাপ করুন!" : "Please assign a destination first!");
        return;
      }

      isSimulating = true;
      label.textContent = currentLang === 'bn' ? "ট্রিপ থামান" : "Stop Trip";
      btn.className = "px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-lg shadow shrink-0 flex items-center gap-1.5 animate-pulse";

      let pathIdx = 0;
      let subStep = 0;
      const subDivisions = 5;

      driveSimulationTimer = setInterval(() => {
        if (pathIdx >= currentRoadPath.length - 1) {
          clearInterval(driveSimulationTimer);
          isSimulating = false;
          label.textContent = currentLang === 'bn' ? "পৌঁছানো হয়েছে" : "Arrived!";
          btn.className = "px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow shrink-0 flex items-center gap-1.5";
          document.getElementById('guidanceText').textContent = currentLang === 'bn' ? "গন্তব্যে পৌঁছানো সম্পন্ন হয়েছে!" : "Destination Reached!";
          document.getElementById('spdMetric').innerHTML = `0.0 <span class="text-xs font-normal">${currentLang === 'bn' ? 'কিমি/ঘণ্টা' : 'km/h'}</span>`;
          return;
        }

        const startPt = currentRoadPath[pathIdx];
        const endPt = currentRoadPath[pathIdx + 1];

        const t = subStep / subDivisions;
        const curLat = startPt[0] + (endPt[0] - startPt[0]) * t;
        const curLon = startPt[1] + (endPt[1] - startPt[1]) * t;

        currentBearing = calculateBearing(startPt[0], startPt[1], endPt[0], endPt[1]);

        vehicleMarker.setLatLng([curLat, curLon]);
        vehicleMarker.setIcon(createAmbulanceIcon(currentBearing));
        map.panTo([curLat, curLon], { animate: true, duration: 0.25 });

        const liveSpeedKmh = (48 + Math.sin(subStep) * 5).toFixed(1);
        document.getElementById('spdMetric').innerHTML = `${liveSpeedKmh} <span class="text-xs font-normal">${currentLang === 'bn' ? 'কিমি/ঘণ্টা' : 'km/h'}</span>`;
        document.getElementById('coordsText').textContent = `${curLat.toFixed(5)}, ${curLon.toFixed(5)}`;

        if (subStep % 2 === 0) {
          transmitPosition(curLat, curLon, liveSpeedKmh / 3.6);
        }

        subStep++;
        if (subStep >= subDivisions) {
          subStep = 0;
          pathIdx++;
        }
      }, 300);
    }

    function fallbackNetworkLocation() {
      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          if (data.latitude && data.longitude) {
            handleResolvedPosition(data.latitude, data.longitude, 0, "Network/IP");
          } else {
            handleResolvedPosition(23.8500, 90.2600, 0, "Ashulia");
          }
        })
        .catch(() => {
          handleResolvedPosition(23.8500, 90.2600, 0, "Ashulia");
        });
    }

    window.onload = () => {
      setLanguage(currentLang);
      establishWebSocket();

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            handleResolvedPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.speed || 0, "GPS");
          },
          (err) => {
            fallbackNetworkLocation();
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
        );
      } else {
        fallbackNetworkLocation();
      }
    };
  </script>
</body>
