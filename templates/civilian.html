<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Public V2X & Civilian Traffic Feed - TrafficPulse</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap');
    body { font-family: 'Hind Siliguri', 'Inter', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="p-3 min-h-screen">
  <div class="max-w-md mx-auto space-y-3">
    
    <!-- Top Bar -->
    <div class="bg-[#131b2e] border border-slate-800 p-3 rounded-xl flex justify-between items-center shadow-lg">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg border border-emerald-500/30">
          <i class="fa-solid fa-satellite"></i>
        </div>
        <div>
          <div class="text-xs font-semibold text-white" data-i18n="civ_title">CIVILIAN V2X BROADCAST</div>
          <div class="text-[10px] text-slate-500" data-i18n="civ_sub">পাবলিক সেফটি নোটিফিকেশন সিস্টেম</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleLanguage()" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs rounded border border-cyan-500/40">
          <span id="langLabel">ENG</span>
        </button>
        <div class="mono text-xs font-medium text-emerald-400" id="timeTick">--:--:--</div>
      </div>
    </div>

    <!-- নোটিফিকেশন অনুমোদন কার্ড -->
    <div id="permCard" class="p-2.5 rounded-xl bg-blue-950/60 border border-blue-500/40 flex justify-between items-center text-xs">
      <span class="text-blue-200"><i class="fa-solid fa-bell text-blue-400 mr-1.5"></i> <span data-i18n="perm_text">লাইভ পুশ নোটিফিকেশন চালু করুন:</span></span>
      <button onclick="requestNotificationAccess()" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-[11px] shadow" data-i18n="btn_allow">
        অনুমতি দিন
      </button>
    </div>

    <!-- Live Emergency Broadcast Banner (500m Doppler Range) -->
    <div id="civilianAlertCard" class="hidden p-4 rounded-xl bg-rose-950/90 border-2 border-rose-500 text-rose-200 shadow-2xl animate-pulse space-y-2">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-triangle-exclamation text-rose-400 text-3xl"></i>
        <div>
          <div class="text-xs font-bold text-white uppercase tracking-wider" data-i18n="alert_inbound">জরুরি অ্যাম্বুলেন্স আসছে (INBOUND)</div>
          <div class="text-sm font-extrabold text-rose-300" id="v2xMessage">লেন ১ অবিলম্বে খালি করুন!</div>
        </div>
      </div>
      <div class="flex justify-between items-center text-[11px] pt-2 border-t border-rose-800/80">
        <span class="text-slate-300"><span data-i18n="lbl_intersection">ইন্টারসেকশন</span>: <b id="v2xSector" class="text-white">মোড়</b></span>
        <span class="bg-rose-600 text-white font-bold px-2 py-0.5 rounded text-[10px]" id="v2xDistance">~৩৫০ মি.</span>
      </div>
    </div>

    <!-- Active Intersection V2X Overhead Display -->
    <div class="bg-[#131b2e] border border-slate-800 p-3 rounded-xl space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-xs font-semibold text-slate-400" data-i18n="vms_list_title">Electronic Variable Message Signs in Range</span>
        <span class="text-[10px] text-emerald-400 mono">● V2MS</span>
      </div>
      <div id="v2xNodes" class="space-y-2">
        <div class="text-slate-500 text-xs italic py-2 text-center" data-i18n="connecting">সার্ভার থেকে ট্রাফিক সাইনবোর্ড লোড হচ্ছে...</div>
      </div>
    </div>

  </div>

  <script>
    const civTranslations = {
      bn: {
        civ_title: "সিভিলিয়ান V2X ব্রডকাস্ট",
        civ_sub: "পাবলিক সেফটি নোটিফিকেশন সিস্টেম",
        perm_text: "লাইভ পুশ নোটিফিকেশন চালু করুন:",
        btn_allow: "অনুমতি দিন",
        alert_inbound: "জরুরি অ্যাম্বুলেন্স আসছে (INBOUND)",
        lbl_intersection: "ইন্টারসেকশন",
        vms_list_title: "নিকটস্থ ইলেকট্রনিক ট্রাফিক সাইনবোর্ড",
        connecting: "সার্ভার থেকে ট্রাফিক সাইনবোর্ড লোড হচ্ছে..."
      },
      en: {
        civ_title: "CIVILIAN V2X BROADCAST",
        civ_sub: "Public Safety Notification System",
        perm_text: "Enable Live Push Notifications:",
        btn_allow: "Allow",
        alert_inbound: "EMERGENCY VEHICLE INBOUND",
        lbl_intersection: "Intersection",
        vms_list_title: "Electronic Variable Message Signs in Range",
        connecting: "Connecting to municipal traffic grid..."
      }
    };

    let currentLang = localStorage.getItem('tp_lang') || 'bn';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('tp_lang', lang);
      document.getElementById('langLabel').textContent = lang === 'bn' ? 'ENG' : 'বাং';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (civTranslations[lang][key]) {
          el.textContent = civTranslations[lang][key];
        }
      });
    }

    function toggleLanguage() {
      setLanguage(currentLang === 'bn' ? 'en' : 'bn');
    }

    let notificationPermissionGranted = false;

    function requestNotificationAccess() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            notificationPermissionGranted = true;
            document.getElementById('permCard').classList.add('hidden');
            new Notification("TrafficPulse V2X Active", {
              body: currentLang === 'bn' ? "অ্যাম্বুলেন্স আসার ৫০০ মিটার আগেই আপনি সতর্কবার্তা পাবেন।" : "Preemption alerts armed for 500m radius.",
              icon: "https://cdn-icons-png.flaticon.com/512/1048/1048315.png"
            });
          }
        });
      }
    }

    if ("Notification" in window && Notification.permission === "granted") {
      notificationPermissionGranted = true;
      document.getElementById('permCard').classList.add('hidden');
    }

    function playAlertTone() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const ws = new WebSocket(proto + window.location.host + '/ws/civilian');

    let lastAlertTime = 0;

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      document.getElementById('timeTick').textContent = data.timestamp;

      const container = document.getElementById('v2xNodes');
      const nodes = Object.values(data.intersections || {});

      if (nodes.length > 0) {
        container.innerHTML = '';
        nodes.forEach(s => {
          container.innerHTML += `
            <div class="p-2.5 rounded-lg bg-black border ${s.corridor_active ? 'border-amber-500 ring-1 ring-amber-500/50' : 'border-slate-800'}">
              <div class="flex justify-between items-center text-[11px] text-slate-400 mb-1">
                <span class="font-semibold text-slate-200">${s.name}</span>
                <span class="mono text-[10px] font-bold ${s.signal === 'GREEN' ? 'text-emerald-400' : 'text-rose-400'}">${s.signal}</span>
              </div>
              <div class="mono text-xs font-bold ${s.corridor_active ? 'text-amber-400 tracking-wider' : 'text-slate-500'}">
                ${s.billboard_msg || 'MAINTAIN POSTED SPEED - DRIVE SAFELY'}
              </div>
            </div>
          `;
        });
      }

      const alertBox = document.getElementById('civilianAlertCard');
      if (data.v2x_alert) {
        document.getElementById('v2xMessage').textContent = data.v2x_alert.message;
        document.getElementById('v2xSector').textContent = data.v2x_alert.node;
        document.getElementById('v2xDistance').textContent = `~${data.v2x_alert.distance_m}m`;
        alertBox.classList.remove('hidden');

        playAlertTone();
        if (navigator.vibrate) navigator.vibrate([300, 150, 300]);

        const now = Date.now();
        if (notificationPermissionGranted && (now - lastAlertTime > 15000)) {
          new Notification("🚨 EMERGENCY VEHICLE INBOUND", {
            body: `${data.v2x_alert.node} - ${data.v2x_alert.message}`,
            icon: "https://cdn-icons-png.flaticon.com/512/1048/1048315.png"
          });
          lastAlertTime = now;
        }
      } else {
        alertBox.classList.add('hidden');
      }
    };

    window.onload = () => {
      setLanguage(currentLang);
    };
  </script>
</body>
</html>
