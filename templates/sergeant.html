<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tactical Field Preemption - TrafficPulse</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="p-3 min-h-screen">
  <div class="max-w-md mx-auto space-y-3">
    
    <div class="bg-[#131b2e] border border-slate-800 p-3 rounded-xl flex justify-between items-center shadow-lg">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center text-lg border border-amber-500/30">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <div class="text-xs font-semibold text-white">FIELD PREEMPTION TERMINAL</div>
          <div class="text-[10px] text-slate-500">Sector Traffic Enforcement</div>
        </div>
      </div>
      <div class="mono text-xs font-medium text-emerald-400" id="clockText">--:--:--</div>
    </div>

    <div id="preemptionNotice" class="hidden p-3.5 rounded-xl bg-rose-950/60 border border-rose-500 text-rose-200 shadow-xl">
      <div class="flex items-center gap-2.5">
        <i class="fa-solid fa-bell text-rose-400 text-xl animate-pulse"></i>
        <div>
          <div class="text-xs font-semibold text-white">INBOUND PREEMPTION ENGAGED</div>
          <div class="text-[11px] text-rose-300">Clear intersection approach immediately for designated priority responder.</div>
        </div>
      </div>
    </div>

    <div class="space-y-2">
      <div class="text-xs font-semibold text-slate-400 px-1">Assigned Intersection Array</div>
      <div id="sergeantNodeList" class="space-y-2"></div>
    </div>

  </div>

  <script>
    const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const ws = new WebSocket(proto + window.location.host + '/ws/sergeant');

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      document.getElementById('clockText').textContent = data.timestamp;

      const container = document.getElementById('sergeantNodeList');
      container.innerHTML = '';

      let preemptionActive = false;

      for (const [id, s] of Object.entries(data.intersections)) {
        if (s.corridor_active) preemptionActive = true;

        container.innerHTML += `
          <div class="p-3 rounded-lg bg-[#131b2e] border ${s.signal === 'GREEN' ? 'border-emerald-500/60 bg-emerald-950/20' : 'border-slate-800'}">
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs font-semibold text-white">${s.name}</span>
              <span class="px-2 py-0.5 text-[10px] font-bold rounded ${s.signal === 'GREEN' ? 'bg-emerald-500 text-slate-950' : 'bg-rose-500/20 text-rose-400'}">
                ${s.signal}
              </span>
            </div>
            <div class="text-[10px] text-slate-400">Flow Index: ${s.speed} km/h | Preemption Status: ${s.corridor_active ? 'ACTIVE LOCK' : 'CYCLIC'}</div>
          </div>
        `;
      }

      const alertBox = document.getElementById('preemptionNotice');
      if (preemptionActive) {
        alertBox.classList.remove('hidden');
        if (navigator.vibrate) navigator.vibrate([250, 100, 250]);
      } else {
        alertBox.classList.add('hidden');
      }
    };
  </script>
</body>
</html>
